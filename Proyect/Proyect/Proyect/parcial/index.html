<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluación Parcial - EmailJS Integration</title>
  <link rel="stylesheet" href="style.css">
  <!-- Carga del SDK de EmailJS -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
  <div class="container">
    <h2>Formulario de Contacto</h2>
    <form id="contact-form">
      <div class="form-group">
        <label for="user_name">Nombre Completo:</label>
        <input type="text" id="user_name" name="user_name" required placeholder="Tu nombre">
      </div>

      <div class="form-group">
        <label for="user_email">Correo Electrónico (Destino/Remitente):</label>
        <input type="email" id="user_email" name="user_email" required placeholder="tu_correo@undc.edu.pe">
      </div>

      <div class="form-group">
        <label for="message">Mensaje:</label>
        <textarea id="message" name="message" rows="4" required placeholder="Escribe tu mensaje aquí"></textarea>
      </div>

      <button type="submit" id="submit-btn">Enviar Correo</button>
    </form>

    <!-- Contenedor para mostrar alertas de confirmación o error -->
    <div id="status-message" class="status"></div>
  </div>

  <script src="javascript.js"></script>
</body>
</html>
